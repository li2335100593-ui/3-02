name: D1 Daily Backup

on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export production D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p ../backups
          TS=$(date -u +%Y%m%d-%H%M%S)
          OUT="../backups/exposure_analytics-${TS}.sql"
          npx wrangler d1 export exposure_analytics --remote --output "$OUT" --skip-confirmation
          gzip "$OUT"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
