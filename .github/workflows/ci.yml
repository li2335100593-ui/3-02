name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax checks
        run: |
          node --check worker/src/index.js
          node --check carousel.js
          node --check tools/player-health-monitor.mjs
          awk '/^<script>$/{flag=1;next} /^<\/script>$/{flag=0} flag' operator-report.html > /tmp/operator-report-main.js
          node --check /tmp/operator-report-main.js
      - name: Carousel resilience tests
        run: bash tests/run-carousel-tests.sh
